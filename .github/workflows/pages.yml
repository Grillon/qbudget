name: Deploy qbudget (static)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static files
        run: |
          test -s index.html
          test -s plotly.min.js
          test -s src/engine.js
      - name: Prepare sanitized site
        run: |
          mkdir -p public-site/src
          cp index.html plotly.min.js public-site/
          cp src/engine.js public-site/src/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site
      - uses: actions/deploy-pages@v4
        id: deployment
