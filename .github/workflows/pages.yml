name: Deploy qbudget (static)
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'main' && github.sha || 'main' }}
          path: versions/main
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'dev' && github.sha || 'dev' }}
          path: versions/dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la version principale
        working-directory: versions/main
        run: ./run-tests.sh
      - name: Vérifier la version de développement
        working-directory: versions/dev
        run: ./run-tests.sh
      - name: Préparer la racine et le sous-dossier dev
        run: node versions/dev/scripts/build-pages.js versions/main versions/dev public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site
      - uses: actions/deploy-pages@v4
        id: deployment
