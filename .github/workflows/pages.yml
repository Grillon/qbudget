name: Deploy qbudget (static)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier cohérence et tests avant publication
        run: ./run-tests.sh
      - name: Verify static files
        run: |
          test -s index.html
          test -s plotly.min.js
          test -s src/engine.js
          test -s src/version.js
          test -s src/demo.js
          test -s src/normalize.js
          test -s src/bank-config.js
          test -s src/tags.js
          test -s src/visual-select.js
          test -s src/annotations.js
          test -s src/editor.js
          test -s src/history-plot.js
          test -s src/ui.js
      - name: Prepare sanitized site
        run: |
          mkdir -p public-site/src
          cp index.html plotly.min.js public-site/
          cp src/engine.js src/version.js src/demo.js src/normalize.js src/bank-config.js src/tags.js src/visual-select.js src/annotations.js src/editor.js src/history-plot.js src/ui.js public-site/src/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site
      - uses: actions/deploy-pages@v4
        id: deployment
