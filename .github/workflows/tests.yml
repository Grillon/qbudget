name: qbudget tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests complets (moteur, scénarios, import, CLI, assets)
        run: ./run-tests.sh
      - name: Parcours fonctionnels Firefox
        run: npm run test:browser
